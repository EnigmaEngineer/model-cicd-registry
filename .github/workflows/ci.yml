name: train, gate, canary

# A merge to main trains a candidate, asks the gate whether it beats what is in production,
# and canaries it if it does. Every decision is an exit code rather than a log line that a
# later step greps, because a grep over stdout passes on a run that printed nothing.
#
# Nothing here has ever executed. There is no GitHub runner in the environment this repo was
# built in, so treat the file as a description of the intended wiring and not as a green
# build. What is checked is narrower and it is checked on every commit: tests/test_workflow.py
# reads this file and fails when it names a script the repo does not have, or branches on an
# exit code the script cannot return. Those are the two ways a workflow rots without anybody
# noticing, and both are catchable without a runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MCR_STORE: sqlite:///${{ github.workspace }}/registry.db
  MCR_MODEL: fraud-scorer

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-tracking.txt

      # run_all.py needs numpy and nothing else. It runs first so a broken core fails in
      # seconds rather than after the tracking layer has built a store.
      - name: unit checks
        run: python3 tests/run_all.py

      - name: checks that need a real store
        run: python3 tests/run_with_mlflow.py

      - name: failure drills
        run: python3 scripts/drill.py

  probes:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-tracking.txt

      # Each of these measures something the README publishes. They are separate steps so a
      # failure names which claim stopped reproducing.
      - name: reproducibility
        run: python3 scripts/repro_probe.py configs/baseline.yml
      - name: tracking
        run: python3 scripts/track_probe.py
      - name: registry
        run: python3 scripts/registry_probe.py
      - name: gate
        run: python3 scripts/gate_probe.py
      - name: canary
        run: python3 scripts/canary_probe.py --trials 50

  deploy:
    runs-on: ubuntu-latest
    needs: [checks, probes]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-tracking.txt

      - name: train the candidate
        run: python3 scripts/train.py configs/baseline.yml --track "$MCR_STORE" --register "$MCR_MODEL"

      # Exit 0 promotes, 1 rejects, 2 refuses. Reject and refuse are different outcomes and
      # the job treats them differently on purpose. A rejected candidate is the gate working
      # and the build is green. A refusal means the gate could not answer, which is a broken
      # build rather than a verdict.
      - name: promotion gate
        id: gate
        run: |
          set +e
          python3 scripts/gate.py --store "$MCR_STORE" --model "$MCR_MODEL" \
            --candidate latest --stage production --promote
          code=$?
          set -e
          echo "verdict=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "2" ]; then
            echo "the gate refused to decide, which is not a verdict"
            exit 1
          fi
          exit 0

      # Only a promoted candidate gets traffic. A rejected one stops here and production is
      # untouched, which is the whole point of the gate running before this step.
      - name: open the canary
        if: steps.gate.outputs.verdict == '0'
        run: python3 scripts/deploy.py open --store "$MCR_STORE" --model "$MCR_MODEL" --canary latest --fraction 0.05

      # Exit 0 lands the canary. 1 aborts it and leaves production alone. 3 holds, which
      # means the split could not separate the two models and is the common answer on a
      # small slice. Hold leaves the canary running for a human to look at.
      - name: read the canary
        id: canary
        run: |
          set +e
          python3 scripts/canary.py --store "$MCR_STORE" --model "$MCR_MODEL" \
            --canary canary --stage production --fraction 0.05
          code=$?
          set -e
          echo "verdict=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: land it
        if: steps.canary.outputs.verdict == '0'
        run: python3 scripts/deploy.py land --store "$MCR_STORE" --model "$MCR_MODEL"

      - name: take it off traffic
        if: steps.canary.outputs.verdict == '1'
        run: python3 scripts/deploy.py abort --store "$MCR_STORE" --model "$MCR_MODEL"

      # Runs whatever happened above, including a cancelled job. A canary left open because
      # a step died is a version taking traffic that nothing is going to read a verdict on.
      - name: report what is deployed
        if: always()
        run: python3 scripts/deploy.py status --store "$MCR_STORE" --model "$MCR_MODEL"
